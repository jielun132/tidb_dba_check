name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Bash smoke checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check documentation and test patch whitespace
        run: git show --format= --check HEAD -- README.md CONTRIBUTING.md CHANGELOG.md .github tests
      - name: Run offline checks
        run: bash tests/smoke.sh
